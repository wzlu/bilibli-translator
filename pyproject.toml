[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "md2zh"
dynamic = ["version"]
description = "将英文 Markdown/HTML/TXT 文件翻译为中文的命令行工具"
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]
license = {text = "MIT"}

[project.urls]
Repository = "https://github.com/wzlu/bilibli-translator"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
md2zh = "md2zh.cli:main"
txt2zh = "md2zh.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# 版本单一来源:src/md2zh/__init__.py 的 __version__,pyproject 不再重复存版本号
[tool.setuptools.dynamic]
version = { attr = "md2zh.__version__" }

# 发版工具(仅配置,不列入 dev 依赖:commitizen 要求 argcomplete<3.7,
# 与 pipx 要求的 >=3.7.2 互斥,同一环境共存会破坏 pipx)。隔离运行:
#   pipx run --spec commitizen cz bump            # 按提交类型自动定级
#   pipx run --spec commitizen cz bump --increment PATCH|MINOR|MAJOR
#   pipx run --spec commitizen cz check --rev-range v0.7.1..HEAD
# 先 --files-only 或 --dry-run 预演;bump 只改版本号并打 tag,
# CHANGELOG 手写(含实证数据与根因分析),刻意不由工具生成。
[tool.commitizen]
name = "cz_customize"
version = "0.7.3"
tag_format = "v$version"
update_changelog_on_bump = false
# 刻意不含 CLAUDE.md:该文件多处散文里出现「当前版本」字样(发版说明、历史
# Recent Updates 条目),而 version_files 的模式是对每行做**非锚定搜索**,
# 实测 v0.7.3 那次 bump 把历史条目「v0.7.2 发版工具链…」误改成 v0.7.3。
# CLAUDE.md 不再复写版本号(改指 md2zh --version),从根上消除该风险。
version_files = [
    "src/md2zh/__init__.py:^__version__",
    "README.md:version-",
]

# 在 Conventional Commits 默认类型上追加本仓库既有的 release 类型
# (历史提交已大量使用 release:,改约定不如让工具认约定)。
# 用 TOML 字面量字符串,正则里的反斜杠无需二次转义。
[tool.commitizen.customize]
message_template = "{{change_type}}{% if scope %}({{scope}}){% endif %}: {{message}}"
schema = "<type>(<scope>): <subject>"
schema_pattern = '(?s)(build|bump|chore|ci|docs|feat|fix|perf|refactor|release|revert|style|test)(\(\S+\))?!?: ([^\n\r]+)((\n\n.*)|(\s*))?$'
bump_pattern = '^(BREAKING CHANGE|feat|fix|perf|refactor)'
bump_map = { MAJOR = "^BREAKING CHANGE", MINOR = "^feat", PATCH = "^(fix|perf|refactor)" }

[tool.pytest.ini_options]
testpaths = ["tests"]
